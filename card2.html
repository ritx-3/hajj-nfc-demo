<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بطاقة الحاج الذكية - محمد علي العتيبي</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;font-family:Arial,sans-serif;color:#173f35}
.wrap{max-width:520px;margin:auto;padding:12px}.card{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 4px 20px #0005}
.head{background:#173f35;color:#fff;text-align:center;padding:18px 14px 20px;border-bottom:5px solid #d9b65b}
.badge{display:inline-block;background:#f0c86e;color:#173f35;padding:8px 18px;border-radius:24px;font-weight:bold}
h1{margin:12px 0 4px;font-size:26px}.sub{font-size:17px}.body{padding:20px 16px}
.profile{text-align:center}.avatar{width:100px;height:100px;border-radius:50%;border:2px solid #d9b65b;object-fit:cover;background:#eee}
.name{font-size:25px;font-weight:bold;margin:10px 0 4px}.nationality{font-size:18px;color:#666}
.info{border:1px solid #e4dfd3;border-radius:18px;margin-top:18px;overflow:hidden}
.row{display:flex;justify-content:space-between;padding:13px 12px;border-bottom:1px solid #eee;font-size:17px}
.row:last-child{border:0}.label{color:#555}.value{font-weight:bold;direction:ltr}
.note{margin-top:18px;background:#e6f4ed;border-radius:14px;padding:13px;text-align:center;font-weight:bold}
</style></head>
<body><div class="wrap"><div class="card">
<div class="head"><span class="badge">نموذج تجريبي - غير رسمي</span><h1>بطاقة الحاج الذكية</h1><div class="sub">Smart Hajj Identity</div></div>
<div class="body"><div class="profile">
<div class="avatar" aria-label="صورة تجريبية"></div>
<div class="name">محمد علي العتيبي</div><div class="nationality">سعودي 🇸🇦</div>
</div>
<div class="info">
<div class="row"><span class="label">رقم الجواز</span><span class="value">A12345678</span></div>
<div class="row"><span class="label">الجنسية</span><span>سعودي</span></div>
<div class="row"><span class="label">تاريخ انتهاء الجواز</span><span class="value">2030-05-20</span></div>
<div class="row"><span class="label">رقم الحدود</span><span class="value">485769213</span></div>
<div class="row"><span class="label">مكان الإقامة</span><span>فندق النور - مكة</span></div>
<div class="row"><span class="label">رقم الحاج</span><span class="value">HJ-3D8F21</span></div>
</div><div class="note">✓ تم التحقق من البيانات عبر الجوازات</div>
</div></div></div></body></html>
