<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>بطاقة الحاج الذكية</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f1e7;color:#173f35}
.wrap{max-width:520px;margin:auto;padding:22px}.card{background:#fff;border-radius:28px;overflow:hidden;box-shadow:0 12px 35px #0002}
.head{background:#173f35;color:#fff;padding:28px 24px;text-align:center;border-bottom:5px solid #c9a45c}
.badge{display:inline-block;background:#c9a45c;color:#173f35;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:bold}
h1{margin:10px 0 4px;font-size:25px}.sub{opacity:.8;font-size:13px}.body{padding:24px}.profile{text-align:center;margin-bottom:22px}
.avatar{width:82px;height:82px;border-radius:50%;margin:auto;background:#e8dfc9;display:flex;align-items:center;justify-content:center;font-size:38px}
.name{font-size:24px;font-weight:bold;margin-top:12px}.nat{color:#68766f;margin-top:5px}
.info{border:1px solid #e4dfd3;border-radius:18px;overflow:hidden}.row{padding:17px;display:flex;justify-content:space-between;gap:15px;border-bottom:1px solid #eee}
.row:last-child{border:0}.label{color:#68766f}.value{font-weight:bold}.ok{margin-top:20px;background:#e8f4ed;color:#17613f;border-radius:15px;padding:15px;text-align:center;font-weight:bold}
.note{margin-top:20px;text-align:center;color:#777;font-size:11px;line-height:1.7}
</style></head>
<body><div class="wrap"><div class="card">
<div class="head"><span class="badge">نموذج تجريبي غير رسمي</span><h1>بطاقة الحاج الذكية</h1><div class="sub">Smart Hajj Identity</div></div>
<div class="body"><div class="profile"><div class="avatar">👤</div><div class="name">حسين التوم</div><div class="nat">🇸🇩 سوداني</div></div>
<div class="info"><div class="row"><span class="label">مكان الإقامة</span><span class="value">فندق دار الإيمان – مكة</span></div><div class="row"><span class="label">رقم البعثة</span><span class="value">G-12</span></div></div>
<div class="ok">✓ تم التحقق من البطاقة التجريبية</div><div class="note">البيانات المعروضة وهمية ومخصصة للعرض والتجربة فقط، ولا تمثل بطاقة حكومية رسمية.</div>
</div></div></div></body></html>
